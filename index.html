:root {
  --canvas: #f3f4f6; --canvas-subtle: #eef0f2;
  --surface: #ffffff; --surface-2: #eef0f2; --surface-3: #e6e8eb; --surface-hover: #f3f4f6;
  --hairline: #e6e8eb; --hairline-strong: #d8dbe0;
  --ink: #101317; --ink-2: #414852; --ink-3: #6b7280; --ink-4: #9aa1ac;
  --brand: #00509d; --brand-hover: #003f7d; --brand-2: #00509d; --brand-3: #0f6fc4;
  --brand-soft: #e8eef5; --brand-soft-2: #dce7f1; --brand-text: #00457f; --on-brand: #ffffff; --brand-mark: #1567b8;
  --ok: #6b7280; --warn: #9a7128; --warn-ink: #7d5c1f; --warn-soft: #f5f1e8;
  --risk: #a15c07; --risk-ink: #874d05; --risk-soft: #f6f0e7;
  --crit: #b42318; --crit-ink: #971d14; --crit-soft: #f8eceb;
  --focus: #00509d; --scrim: rgb(16 19 23 / 0.4); --track: #e6e8eb;
  --shadow-overlay: 0 1px 2px rgb(16 19 23 / 0.06), 0 8px 24px -6px rgb(16 19 23 / 0.12), 0 24px 56px -12px rgb(16 19 23 / 0.14);
  --font-sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
.dark {
  --canvas: #0c0d0f; --canvas-subtle: #101215;
  --surface: #16181b; --surface-2: #1d1f23; --surface-3: #24272c; --surface-hover: #1f2226;
  --hairline: #262a2f; --hairline-strong: #343941;
  --ink: #f2f4f6; --ink-2: #c3c9d1; --ink-3: #8b929c; --ink-4: #626973;
  --brand: #2b7cc9; --brand-hover: #3b8cd9; --brand-2: #4d9ae0; --brand-3: #35b6ec;
  --brand-soft: #16222f; --brand-soft-2: #1a2c3d; --brand-text: #7fb6e6; --brand-mark: #2b83d4;
  --ok: #8b929c; --warn: #b99552; --warn-ink: #d0b17a; --warn-soft: #201c14;
  --risk: #cd8a45; --risk-ink: #e0a970; --risk-soft: #231a12;
  --crit: #e0554b; --crit-ink: #f08a82; --crit-soft: #241614;
  --focus: #4d9ae0; --scrim: rgb(4 5 7 / 0.66); --track: #262a2f;
  --shadow-overlay: 0 1px 2px rgb(0 0 0 / 0.5), 0 12px 32px -8px rgb(0 0 0 / 0.6), 0 32px 64px -16px rgb(0 0 0 / 0.7);
  color-scheme: dark;
}

* { box-sizing: border-box; border-color: var(--hairline); }
html { background: var(--canvas); -webkit-text-size-adjust: 100%; scrollbar-gutter: stable; }
body { margin: 0; min-height: 100vh; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);
  font-size: 13px; letter-spacing: -0.006em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
h1, h2, h3 { letter-spacing: -0.02em; margin: 0; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; letter-spacing: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; }
button:not(:disabled) { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--brand-2); color: #fff; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }

.icon { width: 16px; height: 16px; flex-shrink: 0; }
.i3 { width: 12px; height: 12px; } .i35 { width: 14px; height: 14px; } .i5 { width: 20px; height: 20px; }

/* ---------- Shell ---------- */
.app { display: flex; min-height: 100vh; background: var(--canvas); }
.sidebar { position: sticky; top: 0; z-index: 30; display: flex; flex-direction: column; width: 244px; height: 100vh; flex-shrink: 0; background: var(--surface); user-select: none; }
.brand-zone { display: flex; align-items: center; gap: 10px; height: 74px; padding: 0 16px; flex-shrink: 0; }
.brand-mark { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 12px; background: var(--brand-mark); color: #fff; font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
.brand-name { font-size: 15px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
.brand-unit { margin-top: 3px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.nav { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav-item { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 12px; text-align: left; font-size: 13px; color: var(--ink-2); transition: background-color .15s, color .15s; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item .icon { color: var(--ink-4); }
.nav-item.active { background: var(--brand); color: var(--on-brand); font-weight: 600; }
.nav-item.active .icon { color: var(--on-brand); }
.nav-item .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-badge { border-radius: 8px; padding: 1px 6px; font-family: var(--font-mono); font-size: 11px; font-weight: 500; background: var(--surface-2); color: var(--ink-3); }
.nav-item.active .nav-badge { background: rgb(255 255 255 / 0.2); color: var(--on-brand); }
.nav-badge.crit { background: var(--crit); color: #fff; }
.side-foot { flex-shrink: 0; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.who { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); }
.who-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-sub { font-size: 11px; color: var(--ink-3); }
.pill-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; border-radius: 9999px; background: var(--surface-2); font-size: 12px; font-weight: 500; color: var(--ink-3); transition: background-color .15s, color .15s; }
.pill-btn:hover { background: var(--surface-3); color: var(--ink); }

.main-col { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.header { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--hairline); background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
.header-in { display: flex; align-items: center; gap: 12px; height: 74px; padding: 0 24px; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12.5px; color: var(--ink-3); }
.crumbs b { font-weight: 600; color: var(--ink); }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.vsep { width: 1px; height: 24px; background: var(--hairline); margin: 0 2px; }
.bell { position: relative; }
.bell-count { position: absolute; top: -3px; right: -3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9999px; background: var(--crit); color: #fff; font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
main { flex: 1; min-width: 0; padding: 24px 32px 40px; }
.container { margin: 0 auto; width: 100%; max-width: 1440px; }

/* ---------- Superfícies ---------- */
.stack > * + * { margin-top: 20px; }
.stack-sm > * + * { margin-top: 12px; }
.card { background: var(--surface); border-radius: 12px; padding: 20px; }
.card.flush { padding: 0; overflow: hidden; }
.inset { background: var(--surface-2); border-radius: 12px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-title { font-size: 30px; line-height: 1.15; font-weight: 600; }
.page-desc { margin-top: 8px; max-width: 48rem; font-size: 13px; line-height: 1.6; color: var(--ink-3); }
.page-eyebrow { margin-bottom: 6px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--ink-3); }
.card-title { font-size: 15px; line-height: 1.25; font-weight: 600; }
.card-sub { margin-top: 4px; max-width: 42rem; font-size: 12px; line-height: 1.6; color: var(--ink-3); }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.section-label { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--hairline); font-size: 12px; font-weight: 600; color: var(--ink-3); }
.body-txt { font-size: 13px; line-height: 1.6; color: var(--ink-2); }
.small { font-size: 12px; line-height: 1.6; color: var(--ink-3); }
.tiny { font-size: 11.5px; line-height: 1.55; color: var(--ink-4); }
.strong { font-weight: 600; color: var(--ink); }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.row-flex { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.divide > * + * { border-top: 1px solid var(--hairline); }

/* ---------- Botões ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; gap: 6px; height: 32px; padding: 0 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; white-space: nowrap; transition: background-color .15s, color .15s, opacity .15s; user-select: none; }
.btn:active:not(:disabled) { transform: scale(0.975); }
.btn.md { height: 38px; padding: 0 18px; gap: 8px; }
.btn.xs { height: 28px; padding: 0 12px; font-size: 12px; }
.btn.square { width: 32px; padding: 0; }
.btn.full { width: 100%; }
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.primary:hover { background: var(--brand-hover); }
.btn.secondary { background: var(--surface-2); color: var(--ink); }
.btn.secondary:hover { background: var(--surface-3); }
.btn.on-inset { background: var(--surface); color: var(--ink); }
.btn.on-inset:hover { background: var(--surface-hover); }
.btn.ghost { color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn:disabled { opacity: .45; pointer-events: none; }
.link-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--ink-2); transition: color .15s; }
.link-btn:hover { color: var(--ink); }

/* ---------- Status e tag (§12) ---------- */
.status { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 12px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.status .dot { width: 5px; height: 5px; border-radius: 9999px; flex-shrink: 0; }
.dot.info { background: var(--brand-2); } .dot.warn { background: var(--warn); } .dot.risk { background: var(--risk); }
.dot.crit { background: var(--crit); } .dot.neutral { background: var(--ink-4); }
.status.solid.warn { font-weight: 600; color: var(--warn-ink); }
.status.solid.risk { font-weight: 600; color: var(--risk-ink); }
.status.solid.crit { font-weight: 600; color: var(--crit-ink); }
.status.solid.info { font-weight: 600; color: var(--brand-text); }
.status.healthy { color: var(--ink-3); }
.tag { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; border-radius: 8px; background: var(--surface-2); padding: 2px 6px; font-size: 11px; font-weight: 500; color: var(--ink-3); white-space: nowrap; }

/* ---------- Callout e caixas (§10.9) ---------- */
.callout { position: relative; display: flex; gap: 10px; overflow: hidden; border-radius: 12px; background: var(--surface-2); padding: 14px 14px 14px 16px; }
.callout::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 2px; background: var(--ink-4); }
.callout.info::before { background: var(--brand); } .callout.warn::before { background: var(--warn); } .callout.crit::before { background: var(--crit); }
.callout .c-icon { margin-top: 1px; flex-shrink: 0; color: var(--ink); }
.callout.warn .c-icon, .callout.warn .c-title { color: var(--warn-ink); }
.callout.crit .c-icon, .callout.crit .c-title { color: var(--crit-ink); }
.callout .c-body { min-width: 0; flex: 1; font-size: 12px; line-height: 1.6; }
.callout .c-title { font-weight: 600; color: var(--ink); }
.callout .c-text { color: var(--ink-2); }
.callout .c-title + .c-text { margin-top: 4px; }
.callout .c-action { flex-shrink: 0; align-self: center; }
.fact { border-radius: 12px; background: var(--surface-2); padding: 12px; }
.suggest { border-radius: 12px; background: var(--brand-soft); padding: 12px; }
.suggest-title { font-size: 11px; font-weight: 500; color: var(--brand-text); }
.quote { border-radius: 12px; background: var(--surface-2); padding: 12px 14px; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); }
.quote-by { margin-top: 6px; font-size: 11px; font-weight: 500; color: var(--ink-4); }

/* ---------- DataList ---------- */
.dl { display: grid; gap: 12px 20px; margin: 0; }
.dl.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.dl.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.dl.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.dl dt { font-size: 11px; font-weight: 500; color: var(--ink-4); }
.dl dd { margin: 2px 0 0; font-size: 13px; font-weight: 500; color: var(--ink); }

/* ---------- Formulário (§10.12) ---------- */
.field-top { margin-bottom: 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.field-label { font-size: 12px; font-weight: 500; color: var(--ink); }
.req { margin-left: 4px; color: var(--crit); }
.field-hint { font-size: 11px; color: var(--ink-4); }
.help { margin-top: 6px; font-size: 11.5px; line-height: 1.55; color: var(--ink-4); }
.control { display: flex; align-items: center; gap: 8px; width: 100%; height: 36px; border: 0; border-radius: 12px; background: var(--surface-2); padding: 0 12px; font-size: 13px; color: var(--ink); transition: background-color .15s; }
.control:hover { background: var(--surface-3); }
.control:focus, .control:focus-within { outline: none; box-shadow: 0 0 0 2px var(--focus); }
.control .ph { color: var(--ink-4); }
.control .trail { margin-left: auto; color: var(--ink-4); }
textarea.control { display: block; height: auto; min-height: 104px; padding: 8px 12px; line-height: 1.6; resize: vertical; }
textarea.control::placeholder { color: var(--ink-4); }
.control.readonly { background: var(--surface-2); color: var(--ink-2); }
.form-grid { display: grid; gap: 16px; }
.fg-3 { grid-template-columns: 1.4fr 1fr 1fr; }
.fg-2 { grid-template-columns: 1fr 1fr; }
.calc { display: flex; align-items: center; gap: 10px; height: 36px; }
.calc .num { font-family: var(--font-mono); font-size: 24px; font-weight: 500; line-height: 1; letter-spacing: -0.01em; }
.drop { display: flex; align-items: center; gap: 12px; border-radius: 12px; background: var(--surface-2); padding: 14px; }
.drop-ico { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 12px; background: var(--surface); color: var(--ink-3); }
.file { display: flex; align-items: center; gap: 10px; border-radius: 12px; background: var(--surface); padding: 8px 8px 8px 12px; }
.file-name { min-width: 0; flex: 1; font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.check-row { display: flex; align-items: flex-start; gap: 12px; border-radius: 12px; background: var(--surface-2); padding: 14px; }
.checkbox { margin-top: 1px; display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; flex-shrink: 0; border-radius: 6px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--hairline-strong); color: #fff; }
.checkbox.on { background: var(--brand); box-shadow: none; }
.switch-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; border-radius: 12px; background: var(--surface-2); padding: 14px; }
.switch { position: relative; margin-top: 2px; width: 36px; height: 20px; flex-shrink: 0; border-radius: 9999px; background: var(--hairline-strong); transition: background-color .2s; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 9999px; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .15); transition: left .2s; }
.switch.on { background: var(--brand); } .switch.on::after { left: 18px; }
.missing { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; color: var(--ink-3); }

/* ---------- Segmented e chip ---------- */
.seg-track { position: relative; display: inline-flex; padding: 3px; border-radius: 9999px; background: var(--surface-2); box-shadow: inset 0 1px 2px rgb(16 19 23 / .07); }
.seg-btn { position: relative; display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 9999px; font-size: 12.5px; font-weight: 500; color: var(--ink-3); white-space: nowrap; }
.seg-btn:hover { color: var(--ink); }
.seg-btn.active { font-weight: 600; color: var(--ink); background: var(--surface);
  box-shadow: 0 0 0 .5px rgb(16 19 23 / .06), 0 1px 1px rgb(16 19 23 / .05), 0 3px 8px -2px rgb(16 19 23 / .16), inset 0 1px 0 0 rgb(255 255 255 / .9); }
.seg-count { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; color: var(--ink-4); }
.seg-btn.active .seg-count { color: var(--ink-3); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 9999px; background: var(--surface-2); font-size: 12px; font-weight: 500; color: var(--ink-3); }
.chip:hover { background: var(--surface-3); color: var(--ink); }
.chip.on { background: var(--ink); color: var(--canvas); font-weight: 600; }
.chip.on.crit { background: var(--crit); color: #fff; }
.chip .n { font-family: var(--font-mono); font-size: 10.5px; opacity: .7; }

/* ---------- Metric e meter ---------- */
.metrics { display: flex; gap: 40px; flex-wrap: wrap; }
.metric-v { display: block; font-family: var(--font-mono); font-size: 30px; line-height: 1; font-weight: 500; letter-spacing: -0.02em; color: var(--ink); }
.metric-v.brand { color: var(--brand-text); } .metric-v.crit { color: var(--crit-ink); }
.metric-v small { font-size: 15px; color: var(--ink-4); letter-spacing: 0; }
.metric-l { margin-top: 8px; display: block; font-size: 12px; font-weight: 500; color: var(--ink-3); }
.meter { position: relative; height: 6px; border-radius: 9999px; background: var(--track); }
.meter > .fill { position: absolute; inset: 0 auto 0 0; border-radius: 9999px; background: var(--ink-3); }
.meter > .fill.brand { background: var(--brand); } .meter > .fill.warn { background: var(--warn); } .meter > .fill.crit { background: var(--crit); }
.meter > .target { position: absolute; top: -4px; width: 2px; height: 14px; border-radius: 2px; background: var(--ink); }
.freq { display: grid; grid-template-columns: 110px minmax(0, 1fr); align-items: center; gap: 12px; }
.freq-v { font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
.freq-v.warn { color: var(--warn-ink); font-weight: 600; }

/* ---------- Hint ---------- */
.hint { position: relative; display: inline-flex; vertical-align: middle; color: var(--ink-4); }
.hint:hover { color: var(--ink-2); }
.hint-pop { position: absolute; top: 22px; left: -8px; z-index: 40; width: 268px; border-radius: 12px; background: var(--surface); padding: 12px; font-size: 11.5px; line-height: 1.6; color: var(--ink-2); font-weight: 400; box-shadow: var(--shadow-overlay); white-space: normal; }

/* ---------- Timeline (§10.20) ---------- */
.tl { position: relative; list-style: none; margin: 0; padding: 0; }
.tl::before { content: ''; position: absolute; top: 16px; bottom: 16px; left: 13px; width: 1px; background: var(--hairline); }
.tl li { position: relative; display: flex; gap: 12px; padding-bottom: 18px; }
.tl li:last-child { padding-bottom: 0; }
.tl-node { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex-shrink: 0; border-radius: 9999px; background: var(--surface-2); color: var(--ink-2); }
.tl-node.current { background: var(--brand-soft); color: var(--brand-text); }
.tl-node.alert { background: var(--crit-soft); color: var(--crit-ink); }
.tl-node.warn { background: var(--warn-soft); color: var(--warn-ink); }
.tl-node.next { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--hairline-strong); color: var(--ink-4); }
.tl-body { min-width: 0; flex: 1; padding-top: 3px; }
.tl-title { font-size: 12.5px; line-height: 1.35; font-weight: 600; color: var(--ink); }
.tl li.is-next .tl-title { font-weight: 500; color: var(--ink-3); }
.tl-stamp { flex-shrink: 0; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-4); }
.tl-detail { margin-top: 3px; font-size: 12px; line-height: 1.55; color: var(--ink-3); }
.tl li.is-next .tl-detail { color: var(--ink-4); }

/* ---------- Linhas e tabela ---------- */
.list-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--hairline); background: var(--surface-2); padding: 10px 16px; font-size: 11px; font-weight: 500; color: var(--ink-3); }
.row { position: relative; display: block; width: 100%; padding: 14px 20px; text-align: left; transition: background-color .15s; }
a.row:hover, button.row:hover { background: var(--surface-hover); }
.row.crit::before, .row.active::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 2px; background: var(--crit); }
.row.active { background: var(--surface-2); } .row.active::before { background: var(--brand); }
.row-title { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.row-sub { margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 11px; font-weight: 500; color: var(--ink-4); padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--hairline); white-space: nowrap; }
.tbl td { padding: 12px 16px; border-bottom: 1px solid var(--hairline); font-size: 12.5px; color: var(--ink-2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.clickable:hover td { background: var(--surface-hover); cursor: pointer; }
.tbl td.first { position: relative; }
.tbl tr.crit td.first::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 2px; background: var(--crit); }
.tbl .name { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.tbl .num { text-align: right; }
.pager { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--hairline); background: var(--surface-2); padding: 10px 16px; }

/* ---------- Avatar e identidade ---------- */
.avatar { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 9999px; font-weight: 500; user-select: none; background: var(--surface-2); color: var(--ink-2); width: 32px; height: 32px; font-size: 11px; }
.avatar.md { width: 36px; height: 36px; font-size: 12px; }
.avatar.lg { width: 48px; height: 48px; font-size: 15px; }
.avatar.on-brand { background: rgb(255 255 255 / .15); color: var(--on-brand); }
.avatar.surface { background: var(--surface); }
.identity { background: var(--brand); padding: 16px 20px; display: flex; align-items: center; gap: 16px; }
.identity-name { font-size: 24px; line-height: 1.2; font-weight: 600; color: var(--on-brand); }
.identity-sub { margin-top: 4px; font-size: 13px; color: rgb(255 255 255 / .8); }

/* ---------- Overlays (§10.13) ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); backdrop-filter: blur(14px) saturate(115%); -webkit-backdrop-filter: blur(14px) saturate(115%); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 6vh 24px; }
.modal { position: relative; display: flex; flex-direction: column; width: 100%; max-height: 88vh; overflow: hidden; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-overlay); animation: modal-in .32s cubic-bezier(.16, 1, .3, 1); }
.modal.sm { max-width: 28rem; } .modal.md { max-width: 36rem; } .modal.lg { max-width: 48rem; } .modal.xl { max-width: 64rem; }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-shrink: 0; border-bottom: 1px solid var(--hairline); padding: 16px 20px; }
.modal-ico { margin-top: 2px; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex-shrink: 0; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); }
.modal-title { font-size: 15px; line-height: 1.25; font-weight: 600; }
.modal-sub { margin-top: 3px; font-size: 12px; color: var(--ink-3); }
.modal-body { flex: 1; min-height: 0; overflow-y: auto; }
.modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-shrink: 0; border-top: 1px solid var(--hairline); background: color-mix(in srgb, var(--surface-2) 60%, transparent); padding: 14px 20px; }
.modal-foot .left { margin-right: auto; }
.close { margin: -2px -4px 0 0; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 9999px; color: var(--ink-4); transition: background-color .15s, color .15s; }
.close:hover { background: var(--surface-2); color: var(--ink); }
.drawer-scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); backdrop-filter: blur(14px) saturate(115%); -webkit-backdrop-filter: blur(14px) saturate(115%); display: flex; justify-content: flex-end; }
.drawer { position: relative; display: flex; flex-direction: column; width: 100%; max-width: 42rem; height: 100%; overflow: hidden; border-left: 1px solid var(--hairline); background: var(--surface); box-shadow: var(--shadow-overlay); animation: drawer-in .36s cubic-bezier(.16, 1, .3, 1); }
.drawer-title { font-size: 19px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; }
@keyframes modal-in { from { opacity: 0; transform: translateY(12px) scale(.975); } to { opacity: 1; transform: none; } }
@keyframes drawer-in { from { transform: translateX(100%); } to { transform: none; } }

/* ---------- Navegador do protótipo (some nas capturas) ---------- */
.proto-bar { position: fixed; left: 50%; bottom: 16px; z-index: 70; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 9999px; background: var(--ink); color: var(--canvas); box-shadow: var(--shadow-overlay); font-size: 12px; }
.proto-bar a, .proto-bar button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 9999px; color: inherit; font-weight: 500; }
.proto-bar a:hover, .proto-bar button:hover { background: rgb(255 255 255 / .12); }
.dark .proto-bar a:hover, .dark .proto-bar button:hover { background: rgb(0 0 0 / .12); }
.proto-bar .pos { padding: 0 8px; font-family: var(--font-mono); font-size: 11px; opacity: .7; }
.shot .proto-bar { display: none; }
.shot .modal, .shot .drawer { animation: none; }

/* ---------- Índice ---------- */
.idx { max-width: 1120px; margin: 0 auto; padding: 48px 32px 96px; }
.idx-journey { margin-top: 32px; }
.idx-list { margin-top: 8px; }
.idx-item { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 14px 20px; }
.idx-n { font-family: var(--font-mono); font-size: 12px; color: var(--ink-4); padding-top: 2px; }
.idx-changes { margin: 6px 0 0; padding-left: 16px; font-size: 12px; line-height: 1.6; color: var(--ink-3); }
.new-tag { color: var(--brand-text); background: var(--brand-soft); }

@media (max-width: 1100px) {
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .dl.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .sidebar { display: none; }
  main { padding: 20px 16px 88px; }
  .fg-3, .fg-2 { grid-template-columns: 1fr; }
  .page-title { font-size: 24px; }
  .tbl-wrap { overflow-x: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* Callout solto no canvas ganha a superfície do card; dentro do card, fica recuado. */
.container > .stack > .callout, .grid-2 > .stack > .callout, aside.stack > .callout { background: var(--surface); }
.has-overlay { overflow: hidden; }
.list-top .seg-track { background: var(--surface-3); }

/* ================= v3: fluxo simplificado, computador e celular ================= */
.m-top, .tabbar { display: none; }
.narrow { max-width: 680px; margin: 0 auto; }
.step-n { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 9999px; background: var(--surface-2); font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--ink-2); flex-shrink: 0; }
.step-n.done { background: var(--ink); color: var(--canvas); }
.q { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 9999px; background: var(--surface-2); font-size: 13px; font-weight: 500; color: var(--ink-2); transition: background-color .15s, color .15s; }
.choice:hover { background: var(--surface-3); color: var(--ink); }
.choice.on { background: var(--ink); color: var(--canvas); font-weight: 600; }
.case { border-radius: 12px; background: var(--brand-soft); padding: 18px; }
.case-eyebrow { font-size: 12px; font-weight: 500; color: var(--brand-text); }
.case-title { margin-top: 4px; font-size: 19px; line-height: 1.25; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
.case-list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.case-list li { display: flex; gap: 10px; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.case-list li .icon { margin-top: 2px; color: var(--brand-text); }
.case-list b { font-weight: 600; color: var(--ink); }
.hero-ok { display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 9999px; background: var(--surface-2); color: var(--ink); }
.big-title { font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; }
.steps { display: grid; gap: 8px; }
.steps .st { display: flex; flex-direction: column; gap: 8px; }
.steps .bar { height: 4px; border-radius: 9999px; background: var(--track); }
.steps .st.done .bar { background: var(--ink-3); }
.steps .st.now .bar { background: var(--brand); }
.steps .lbl { font-size: 11.5px; line-height: 1.35; font-weight: 500; color: var(--ink-4); }
.steps .st.done .lbl { color: var(--ink-3); }
.steps .st.now .lbl { color: var(--ink); font-weight: 600; }
.todo { border-radius: 12px; background: var(--surface-2); padding: 16px; }
.notify-line { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
.ebook-link { display: flex; align-items: center; gap: 12px; border-radius: 12px; background: var(--surface); padding: 14px 16px; transition: background-color .15s; }
.ebook-link:hover { background: var(--surface-hover); }
.ebook-ico { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: var(--brand); color: var(--on-brand); flex-shrink: 0; }

@media (max-width: 760px) {
  .header { display: none; }
  .m-top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--hairline); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
  .m-top .brand-mark { width: 30px; height: 30px; font-size: 13px; }
  .m-top .t { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
  .m-top .r { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--hairline); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; border-radius: 12px; font-size: 11px; font-weight: 500; color: var(--ink-3); }
  .tab.on { color: var(--brand-text); font-weight: 600; }
  .tab .icon { width: 20px; height: 20px; }
  main { padding: 16px 16px 96px; }
  .card { padding: 16px; }
  .big-title { font-size: 21px; }
  .page-title { font-size: 22px; }
  .m-full { width: 100%; }
  .m-stack { flex-direction: column; align-items: stretch !important; }
  .m-hide { display: none !important; }
  .case { padding: 16px; }
  .case-title { font-size: 17px; }
  .proto-bar { bottom: 84px; }
}
.shot body { position: relative; }
.shot .tabbar { position: absolute; }
@media (max-width: 760px) { .form-grid.dates { grid-template-columns: 1fr 1fr; gap: 10px; } }
/* ---- v4: demonstração ---- */
.sr { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.check-row { position: relative; cursor: pointer; }
input.control[type=date] { font-family: var(--font-mono); font-size: 13px; cursor: pointer; }
input.control[type=date]::-webkit-calendar-picker-indicator { opacity: .5; cursor: pointer; }
.demo-bar { position: relative; z-index: 40; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--ink); color: var(--canvas); }
.demo-l { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .6; flex-shrink: 0; }
.demo-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.demo-tabs::-webkit-scrollbar { display: none; }
.demo-tab { flex-shrink: 0; height: 30px; padding: 0 12px; border-radius: 9999px; font-size: 12.5px; font-weight: 500; color: rgb(255 255 255 / .72); white-space: nowrap; transition: background-color .15s, color .15s; }
.demo-tab:hover { background: rgb(255 255 255 / .1); color: #fff; }
.demo-tab.on { background: #fff; color: var(--ink); font-weight: 600; }
.demo-reset { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 9999px; font-size: 12px; font-weight: 500; color: rgb(255 255 255 / .72); }
.demo-reset:hover { background: rgb(255 255 255 / .1); color: #fff; }
.sidebar { height: calc(100vh - 46px); top: 0; }
#toast { position: fixed; right: 24px; bottom: 24px; z-index: 60; width: min(384px, calc(100vw - 32px)); pointer-events: none; opacity: 0; transform: translateY(14px) scale(.97); transition: opacity .2s, transform .3s cubic-bezier(.16,1,.3,1); }
#toast.on { opacity: 1; transform: none; }
.toast-in { position: relative; display: flex; gap: 12px; overflow: hidden; border-radius: 12px; background: var(--surface); padding: 14px 14px 14px 16px; box-shadow: var(--shadow-overlay); }
.toast-in > .icon { margin-top: 1px; color: var(--ink-2); }
.toast-bar { position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--brand-2); }
.toast-t { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.toast-d { margin-top: 2px; font-size: 11.5px; line-height: 1.55; color: var(--ink-3); }
.bell { position: relative; }
.pop { position: absolute; right: 0; top: 40px; z-index: 50; width: 360px; max-width: calc(100vw - 24px); overflow: hidden; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-overlay); text-align: left; animation: modal-in .22s cubic-bezier(.16,1,.3,1); }
.pop-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--hairline); background: var(--surface-2); }
.pop-list { max-height: 400px; overflow-y: auto; }
.pop-item { padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
.pop-item:last-child { border-bottom: 0; }
.pop-item.unread { background: color-mix(in srgb, var(--brand-soft) 50%, transparent); }
.coord-grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
.coord-item { padding: 14px 18px; }
.drow { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 20px; }
.drow.crit::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 2px; background: var(--crit); }
.drow-main { min-width: 0; flex: 1; }
.drow-act { flex-shrink: 0; }
.aviso p { font-size: 13px; line-height: 1.65; color: var(--ink-2); }
.aviso p + p { margin-top: 10px; }
.aviso h3 { margin: 18px 0 6px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.aviso ol { margin: 8px 0 0; padding-left: 20px; font-size: 13px; line-height: 1.8; color: var(--ink); }
.doc-prev { margin: 0 auto; max-width: 340px; aspect-ratio: 1 / 1.3; border-radius: 12px; background: var(--surface-2); padding: 28px; display: flex; flex-direction: column; gap: 10px; }
.doc-line { height: 8px; border-radius: 9999px; background: var(--surface-3); }
.w60 { width: 60%; } .w40 { width: 40%; } .w80 { width: 80%; } .w30 { width: 30%; margin-left: auto; }
@media (max-width: 1000px) { .coord-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .demo-bar { padding: 6px 10px; gap: 8px; } .demo-l { display: none; }
  .m-top { top: 0; }
  .drow { flex-direction: column; align-items: stretch; gap: 12px; }
  .drow-act .btn { width: 100%; }
  #toast { right: 16px; bottom: 84px; }
  .modal-foot { flex-wrap: wrap; } .modal-foot .left { width: 100%; }
  .scrim { padding: 12px; }
  .pop { position: fixed; top: 100px; right: 12px; }
}

/* ======= Motion (Design System §8): spring entre posições, emphasis na chegada, saída mais rápida ======= */
:root { --emphasis: cubic-bezier(.16, 1, .3, 1); --exit: cubic-bezier(.4, 0, 1, 1); --spring: cubic-bezier(.32, .72, 0, 1); }
.must { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 1.5; font-weight: 500; color: var(--crit-ink); }
.must .icon { margin-top: 2px; }
.must-ink { font-weight: 600; color: var(--crit-ink); }
.case-more { margin-top: 12px; color: var(--brand-text); font-weight: 600; }
.case-more:hover { color: var(--brand); }
.ed-sep { height: 1px; background: var(--hairline); margin: 20px 0 4px; }
.brand-zone img, .m-top img { image-rendering: auto; }

/* Pastilha física que desliza (segmented e barra de cenários) */
[data-seg] { position: relative; }
.seg-pill { position: absolute; top: 0; left: 0; z-index: 0; border-radius: 9999px; pointer-events: none; opacity: 0;
  transition: transform .34s var(--spring), width .34s var(--spring), opacity .15s; will-change: transform; }
.seg-track .seg-pill { background: var(--surface); box-shadow: 0 0 0 .5px rgb(16 19 23 / .06), 0 1px 1px rgb(16 19 23 / .05), 0 3px 8px -2px rgb(16 19 23 / .16), inset 0 1px 0 0 rgb(255 255 255 / .9); }
.demo-tabs .seg-pill { background: #fff; }
.seg-btn, .demo-tab { position: relative; z-index: 1; }
.seg-btn.active { background: transparent; box-shadow: none; }
.demo-tab.on { background: transparent; color: var(--ink); }
.demo-tab, .seg-btn { transition: color .2s; }

/* Toque */
.btn, .choice, .seg-btn, .demo-tab, .nav-item, .tab, .drop, .chip, .ebook-link, .coord-item, .link-btn, .close { transition: background-color .15s, color .15s, opacity .15s, transform .12s var(--emphasis); }
.choice:active, .seg-btn:active, .demo-tab:active, .nav-item:active, .tab:active, .drop:active, .ebook-link:active, .coord-item:active, .close:active { transform: scale(.975); }
.choice.on { transition: background-color .2s var(--emphasis), color .2s; }

/* Entrada de tela */
@keyframes page-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes item-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.page-enter { animation: page-in .26s var(--emphasis) both; }
.page-enter .drow, .page-enter .coord-item { animation: item-in .28s var(--emphasis) both; animation-delay: calc(var(--i, 0) * 35ms + 40ms); }

/* O quadro do caso chega quando as datas fecham */
@keyframes reveal { from { opacity: 0; transform: translateY(6px) scale(.99); } to { opacity: 1; transform: none; } }
.case { animation: reveal .36s var(--emphasis) both; transform-origin: top center; }
.file { animation: reveal .26s var(--emphasis) both; }

/* Barras: progresso cresce, nunca pula */
.meter > .fill { transition: width .8s var(--emphasis); }
@keyframes fill-in { from { width: 0; } }
.page-enter .meter > .fill { animation: fill-in .8s var(--emphasis) both .12s; }
.steps .bar { position: relative; overflow: hidden; background: var(--track) !important; }
.steps .bar::after { content: ''; position: absolute; inset: 0; border-radius: inherit; transform-origin: left; transform: scaleX(0); background: var(--ink-3); transition: transform .6s var(--emphasis), background-color .3s; }
.steps .st.done .bar::after { transform: scaleX(1); }
.steps .st.now .bar::after { transform: scaleX(1); background: var(--brand); }
@keyframes bar-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.page-enter .steps .st.done .bar::after, .page-enter .steps .st.now .bar::after { animation: bar-in .7s var(--emphasis) both; animation-delay: calc(var(--i, 0) * 70ms + 80ms); }
.steps .lbl { transition: color .3s; }

/* Checkbox */
.checkbox { transition: background-color .15s, box-shadow .15s; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.checkbox.on .icon { animation: pop .24s var(--spring); }

/* Overlays: scrim 180 ms, folha com springSoft; saída 130 ms */
@keyframes scrim-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes scrim-out { to { opacity: 0; } }
@keyframes sheet-out { to { opacity: 0; transform: translateY(6px) scale(.985); } }
.scrim { animation: scrim-in .18s var(--emphasis) both; }
.modal { animation: modal-in .34s var(--emphasis) both; }
.scrim.leaving { animation: scrim-out .14s var(--exit) forwards; pointer-events: none; }
.scrim.leaving .modal { animation: sheet-out .13s var(--exit) forwards; }
@keyframes pop-in { from { opacity: 0; transform: translateY(-6px) scale(.96); } to { opacity: 1; transform: none; } }
.pop { animation: pop-in .22s var(--spring) both; transform-origin: top right; }

/* Toast: chega com mola, sai rápido */
#toast { transition: opacity .14s var(--exit), transform .14s var(--exit); }
#toast.on { transition: opacity .2s var(--emphasis), transform .36s var(--emphasis); }

@media (prefers-reduced-motion: reduce) {
  .page-enter, .page-enter *, .case, .file, .modal, .scrim, .pop { animation: none !important; }
  .seg-pill { transition: none !important; }
}
.case-list b.must-ink, b.must-ink { color: var(--crit-ink); font-weight: 600; }
.case-list li:has(.must-ink) .icon { color: var(--crit-ink); }

/* Primitivos do protótipo — espelham as classes do Design System UniAnchieta 3.0.
   Uma primária por tela. Status é ponto + palavra. Callout leva o tom num trilho de 2px. */

const I = (name, cls = '') => (ICONS[name] || '').replace('<svg', `<svg class="icon ${cls}" aria-hidden="true"`);

const STUDENT = {
  nome: 'Victor Capitani Pansonato', ini: 'VP', ra: '2607454',
  curso: 'Bacharelado em Ciências Contábeis', turno: 'Noturno',
};

function btn(label, o = {}) {
  const v = o.v || 'secondary';
  const cls = ['btn', v, o.size || '', o.square ? 'square' : '', o.full ? 'full' : ''].join(' ');
  const inner = `${o.icon ? I(o.icon, o.size === 'xs' ? 'i35' : '') : ''}${o.square ? '' : label}${o.iconRight ? I(o.iconRight, 'i35') : ''}`;
  const aria = o.square ? ` aria-label="${label}"` : '';
  if (o.href && !o.disabled) return `<a class="${cls}" href="${o.href}"${aria}>${inner}</a>`;
  return `<button class="${cls}"${o.disabled ? ' disabled' : ''}${aria}>${inner}</button>`;
}

/* STATUS: veredito. healthy = melhor faixa, só a palavra, sem ponto. */
function status(label, tone = 'neutral', solid = false) {
  if (tone === 'healthy') return `<span class="status healthy">${label}</span>`;
  return `<span class="status ${solid ? 'solid ' + tone : ''}"><span class="dot ${tone}"></span>${label}</span>`;
}
const tag = (t, cls = '') => `<span class="tag ${cls}">${t}</span>`;

function callout(tone, title, text, o = {}) {
  const icon = o.icon === false ? '' : `<span class="c-icon">${I(o.icon || (tone === 'crit' || tone === 'warn' ? 'triangle-alert' : 'info'))}</span>`;
  return `<div class="callout ${tone}">${icon}<div class="c-body">${title ? `<p class="c-title">${title}</p>` : ''}${text ? `<div class="c-text">${text}</div>` : ''}${o.after || ''}</div>${o.action ? `<div class="c-action">${o.action}</div>` : ''}</div>`;
}

function field(label, control, o = {}) {
  return `<div><div class="field-top"><span class="field-label">${label}${o.required ? '<span class="req">*</span>' : ''}</span>${o.hint ? `<span class="field-hint">${o.hint}</span>` : ''}</div>${control}${o.help ? `<p class="help">${o.help}</p>` : ''}</div>`;
}
const ctrl = (value, o = {}) => `<div class="control ${o.cls || ''}">${o.icon ? `<span style="color:var(--ink-4)">${I(o.icon, 'i35')}</span>` : ''}${value ? `<span${o.mono ? ' class="mono"' : ''}>${value}</span>` : `<span class="ph">${o.ph || ''}</span>`}${o.trail ? `<span class="trail">${I(o.trail, 'i35')}</span>` : ''}</div>`;

const dl = (items, cols = 4) => `<dl class="dl c${cols}">${items.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;

function hint(label, text) {
  return `<span class="hint" tabindex="0" role="button" aria-label="Como ${label} é calculado" data-hint>${I('info', 'i35')}<span class="hint-pop" role="tooltip" hidden>${text}</span></span>`;
}

function meter(pct, o = {}) {
  return `<div class="meter" role="meter" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"${o.label ? ` aria-label="${o.label}"` : ''}><span class="fill ${o.tone || ''}" style="width:${pct}%"></span>${o.target ? `<span class="target" style="left:calc(${o.target}% - 1px)" title="mínimo ${o.target}%"></span>` : ''}</div>`;
}

/* Frequência contra o mínimo. Abaixo do mínimo = âmbar (atenção), não vermelho:
   a compensação ainda vai recalcular. */
function freq(pct, o = {}) {
  const min = 75, below = pct < min;
  return `<div><div class="between" style="margin-bottom:6px"><span class="small" style="font-weight:500">Frequência ${hint('a frequência', 'Presença registrada na disciplina até hoje. O mínimo para aprovação é 75%. Quando a atividade de compensação é avaliada como satisfatória, as faltas do período do atestado são abonadas e a frequência é recalculada.')}</span><span class="freq-v ${below ? 'warn' : ''}">${pct}%${o.after ? ` <span style="color:var(--ink-4);font-weight:400">→</span> <span style="color:var(--ink)">${o.after}%</span>` : ''}</span></div>${meter(o.after || pct, { target: min, tone: (o.after || pct) < min ? 'warn' : '', label: 'Frequência' })}<div class="between tiny" style="margin-top:5px"><span>${o.note || (below ? 'Sobe com a compensação' : 'Acima do mínimo')}</span><span>mínimo 75%</span></div></div>`;
}

/* Timeline: done | current | next | alert | warn */
function timeline(items) {
  const icon = { done: 'check', current: 'circle-dot', next: 'clock', alert: 'circle-x', warn: 'rotate-ccw' };
  return `<ol class="tl">${items.map(it => `<li class="${it.state === 'next' ? 'is-next' : ''}"><span class="tl-node ${it.state === 'done' ? '' : it.state}">${I(it.icon || icon[it.state], 'i35')}</span><div class="tl-body"><div class="between" style="align-items:baseline;flex-wrap:wrap;gap:2px 12px"><p class="tl-title">${it.title}</p>${it.stamp ? `<span class="tl-stamp">${it.stamp}</span>` : ''}</div>${it.detail ? `<p class="tl-detail">${it.detail}</p>` : ''}</div></li>`).join('')}</ol>`;
}

function fileRow(name, size, o = {}) {
  return `<div class="file">${I('file-text', 'i35')}<span class="file-name">${name}</span><span class="tiny mono">${size}</span>${o.remove ? btn('Remover arquivo', { v: 'ghost', square: true, icon: 'x', size: 'xs' }) : ''}${o.action || ''}</div>`;
}

function segmented(opts, active) {
  return `<div class="seg-track" role="tablist">${opts.map(([l, n], i) => `<button role="tab" aria-selected="${i === active}" class="seg-btn ${i === active ? 'active' : ''}">${l}${n !== undefined ? `<span class="seg-count">${n}</span>` : ''}</button>`).join('')}</div>`;
}

function modal({ title, sub, icon, body, foot, size = 'lg', close = '' }) {
  return `<div class="scrim" data-close="${close}"><div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="mt"><header class="modal-head"><div class="row-flex" style="gap:12px;flex-wrap:nowrap;align-items:flex-start">${icon ? `<span class="modal-ico">${I(icon)}</span>` : ''}<div><h2 class="modal-title" id="mt">${title}</h2>${sub ? `<p class="modal-sub">${sub}</p>` : ''}</div></div>${close ? `<a class="close" href="${close}" aria-label="Fechar">${I('x')}</a>` : `<button class="close" aria-label="Fechar">${I('x')}</button>`}</header><div class="modal-body">${body}</div>${foot ? `<footer class="modal-foot">${foot}</footer>` : ''}</div></div>`;
}

function drawer({ title, statusHtml, body, foot, close = '' }) {
  return `<div class="drawer-scrim"><aside class="drawer" role="dialog" aria-modal="true" aria-label="${title}"><header class="modal-head" style="padding:18px 24px"><div><h2 class="drawer-title">${title}</h2>${statusHtml ? `<div style="margin-top:6px">${statusHtml}</div>` : ''}</div><a class="close" href="${close}" aria-label="Fechar">${I('x')}</a></header><div class="modal-body">${body}</div>${foot ? `<footer class="modal-foot" style="padding:14px 24px">${foot}</footer>` : ''}</aside></div>`;
}

      ${k ? `<div class="case"><p class="case-eyebrow">${dias} ${dias === 1 ? 'dia' : 'dias'} de afastamento · ${MOD[mod].label}</p><h2 class="case-title">${k.title}</h2><ul class="case-list">${k.items.map(([ic, t]) => `<li>${I(ic, 'i35')}<span>${t}</span></li>`).join('')}</ul>${mod === 'ed' ? `<button class="link-btn case-more" data-a="open-ed">${I('book-marked', 'i35')}O que é o Estudo Dirigido?</button>` : ''}</div>` : ''}
      <div class="stack-sm" ${valid ? '' : 'style="opacity:.45;pointer-events:none"'}><p class="q"><span class="step-n ${d.files.length ? 'done' : ''}">${d.files.length ? I('check', 'i3') : '3'}</span>Anexe ${TIPOS[d.tipo].doc}</p>
        <input type="file" id="f-doc" data-in="files" multiple accept=".pdf,.doc,.docx,image/*" hidden>
        ${d.files.map((f, i) => `<div class="file" style="background:var(--surface-2)">${I('file-text', 'i35')}<span class="file-name">${esc(f)}</span><button class="btn ghost xs square" data-a="rm-file" data-i="${i}" aria-label="Remover arquivo">${I('x', 'i35')}</button></div>`).join('')}
        ${d.files.length ? `<button class="link-btn" data-a="pick" data-target="f-doc">${I('paperclip', 'i35')}Anexar outro arquivo</button>` : `<button class="drop" style="width:100%;text-align:left" data-a="pick" data-target="f-doc"><span class="drop-ico">${I('upload')}</span><span style="flex:1;min-width:0"><span class="strong" style="display:block;font-size:13px">Toque para anexar ou tirar uma foto</span><span class="tiny">PDF, Word ou imagem. Pode enviar mais de um arquivo.</span></span></button>`}</div>
      <label class="check-row" ${valid ? '' : 'style="opacity:.45;pointer-events:none"'}><input type="checkbox" data-in="agree" ${d.agree ? 'checked' : ''} class="sr"><span class="checkbox ${d.agree ? 'on' : ''}">${d.agree ? I('check', 'i3') : ''}</span><span class="small" style="color:var(--ink-2)">Entendi que, durante o afastamento, <b class="must-ink">não posso fazer atividades e provas no AVA</b>. Posso assistir às aulas e ler os materiais.</span></label>
      ${d.showMsg ? field('Recado para a coordenação (opcional)', `<textarea class="control" rows="2" style="min-height:64px" data-in="msg" placeholder="Se quiser, explique algo sobre o documento">${esc(d.msg)}</textarea>`) : ''}
      <div class="stack-sm">${A('Enviar documento', 'submit', { v: 'primary', size: 'md', icon: 'send', full: true, disabled: !ok })}
        <p class="notify-line" style="justify-content:center">${ok ? `${I('mail-check', 'i35')}Você recebe um aviso no aplicativo e por e-mail a cada etapa.` : `${I('info', 'i35')}${missing}`}</p>
        ${d.showMsg ? '' : `<button class="link-btn" style="justify-content:center;width:100%" data-a="show-msg">${I('message-circle', 'i35')}Quer deixar um recado para a coordenação? (opcional)</button>`}</div>
    </section>
    ${ebookCard('Dúvidas? Veja o regulamento simples')}</div>`;
}

/* ---------- Aluno: acompanhamento ---------- */
function discRow(r, d, i) {
  let st, body = '', action = '';
  if (d.st === 'aguardando') { st = status('Aguardando o professor', 'neutral'); body = 'O professor está preparando a atividade. Ela chega até você pelo aplicativo e por e-mail.'; }
  if (d.st === 'publicada') { st = status('Para entregar', 'info', true); body = `Entregue até <b class="mono" style="font-weight:500;color:var(--ink)">${fmt(d.prazo)}</b> às 23h59.`; action = A('Enviar atividade', 'act-open', { v: 'secondary', icon: 'upload', data: { d: i } }); }
  if (d.st === 'entregue') { st = status('Entregue', 'neutral'); body = `Você entregou em <span class="mono">${fmt(d.entAt)}</span>. O professor vai avaliar.`; }
  if (d.st === 'refazer') { st = status('Segunda chance', 'warn', true); body = `<div class="quote" style="margin-top:2px">${esc(d.devolutiva)}<p class="quote-by">Comentário de ${PROFS[d.prof]}</p></div><p style="margin-top:8px">Reenvie até <b class="mono" style="font-weight:500;color:var(--ink)">${fmt(d.prazo2)}</b> às 23h59.</p>`; action = A('Reenviar atividade', 'act-open', { v: 'secondary', icon: 'rotate-ccw', data: { d: i } }); }
  if (d.st === 'aceita') { st = status('Faltas compensadas', 'healthy'); body = `Atividade aceita em <span class="mono">${fmt(d.evalAt)}</span>.`; }
  if (d.st === 'recusada') { st = status('Não compensada', 'crit', true); body = 'A segunda entrega não foi aceita. As faltas desta disciplina continuam registradas.'; }
  if (d.st === 'ed') { st = status('No estudo dirigido', 'healthy'); body = 'Entrou automaticamente, sem custo. Acompanhe o card da disciplina no AVA.'; }
  return `<div class="drow ${d.st === 'recusada' ? 'crit' : ''}" style="--i:${i}"><div class="drow-main"><div class="row-flex" style="gap:8px 10px"><p class="row-title">${d.nome}</p>${st}</div><p class="row-sub"><span class="mono">${d.cod}</span><span>·</span><span>${PROFS[d.prof]}</span><span>·</span><span>Frequência <span class="mono">${d.freq}%</span></span></p><div class="small" style="margin-top:8px;color:var(--ink-2)">${body}</div></div>${action ? `<div class="drow-act">${action}</div>` : ''}</div>`;
}
function alunoTrack(sid, r) {
  const st = STUD[sid], mod = modOf(daysBetween(r.ini, r.fim)), dias = daysBetween(r.ini, r.fim);
  const labels = { auto: ['Enviado', 'Análise', 'Faltas removidas'], ativ: ['Enviado', 'Análise', 'Atividades', 'Faltas compensadas'], ed: ['Enviado', 'Análise', 'Estudo dirigido', 'Faltas compensadas'] }[mod];
  const now = r.status === 'analise' || r.status === 'ajuste' ? 1 : r.status === 'aprovada' ? 2 : labels.length;
  let main = '', list = '', extra = '';
  if (r.status === 'analise') main = `<div class="row-flex" style="gap:14px;flex-wrap:nowrap;align-items:flex-start"><div class="hero-ok" style="width:40px;height:40px">${I('clock')}</div><div><h2 class="big-title" style="font-size:19px">Recebemos seu documento</h2><p class="body-txt" style="margin-top:4px">A coordenação está conferindo. Assim que houver novidade, você recebe um aviso no aplicativo e por e-mail. Não precisa voltar aqui.</p></div></div>`;
  if (r.status === 'ajuste') main = `<div class="row-flex" style="gap:14px;flex-wrap:nowrap;align-items:flex-start"><div class="hero-ok" style="width:40px;height:40px;background:var(--warn-soft);color:var(--warn-ink)">${I('triangle-alert')}</div><div style="flex:1"><h2 class="big-title" style="font-size:19px">Precisamos de um ajuste</h2><p class="body-txt" style="margin-top:4px"><b style="font-weight:600;color:var(--ink)">${esc(r.motivo)}.</b> ${r.obs ? esc(r.obs) + ' ' : ''}Corrija e envie de novo. Leva menos de um minuto.</p><div style="margin-top:14px">${A('Enviar novamente', 'resend', { v: 'primary', size: 'md', icon: 'rotate-ccw' })}</div></div></div>`;
  if (r.status === 'compensada' && mod === 'auto') main = `<div class="row-flex" style="gap:14px;flex-wrap:nowrap;align-items:flex-start"><div class="hero-ok" style="width:40px;height:40px">${I('circle-check')}</div><div><h2 class="big-title" style="font-size:19px">Tudo certo, ${st.first}</h2><p class="body-txt" style="margin-top:4px">Suas faltas de ${periodo(r)} foram removidas em todas as disciplinas. Não há nada para você fazer.</p></div></div>`;
  if (mod === 'ativ' && r.disc && (r.status === 'aprovada' || r.status === 'compensada' || r.status === 'concluida')) {
    const todo = r.disc.filter(d => d.st === 'publicada' || d.st === 'refazer').length;
    const done = r.disc.filter(d => d.st === 'aceita').length;
    const title = r.status === 'compensada' ? 'Pronto! Faltas compensadas em todas as disciplinas' : r.status === 'concluida' ? 'Compensação encerrada' : todo ? `Você tem ${todo} ${todo === 1 ? 'atividade' : 'atividades'} para entregar` : 'Nada para fazer agora';
    const sub = r.status === 'compensada' ? 'Todas as atividades foram aceitas.' : r.status === 'concluida' ? 'Veja abaixo o resultado de cada disciplina.' : todo ? 'Envie pelo botão de cada disciplina. Leva menos de um minuto.' : 'Os professores estão preparando as atividades. Cada uma chega até você pelo aplicativo e por e-mail.';
    main = `<p class="small" style="font-weight:500">O que fazer agora</p><h2 class="big-title" style="font-size:19px;margin-top:4px">${title}</h2><p class="body-txt" style="margin-top:4px">${sub}</p>
      <div class="between" style="margin-top:14px;gap:16px"><div style="flex:1;max-width:340px"><div class="between tiny" style="margin-bottom:6px"><span style="color:var(--ink-3);font-weight:500">Disciplinas compensadas</span><span class="mono" style="color:var(--ink)">${done} de ${r.disc.length}</span></div>${meter(Math.round(done / r.disc.length * 100), { tone: 'brand' })}</div><div style="text-align:right"><p class="tiny">Prazo das atividades</p><p class="mono" style="font-size:13px;font-weight:500">${fmt(addDays(r.fim, 15))}</p></div></div>`;
    list = `<section class="card flush"><div class="list-top"><span>Suas disciplinas</span><span><span class="mono">${r.disc.length}</span> no total</span></div><div class="divide">${r.disc.map((d, i) => discRow(r, d, i)).join('')}</div></section>`;
  }
  if (mod === 'ed' && r.status === 'aprovada') {
    main = `<p class="small" style="font-weight:500">O que fazer agora</p><h2 class="big-title" style="font-size:19px;margin-top:4px">Nada. Suas disciplinas já estão no estudo dirigido</h2><p class="body-txt" style="margin-top:4px">Sem custo e sem inscrição. Você começa depois do fim do afastamento, nas datas do calendário acadêmico, e tudo aparece no card da disciplina no AVA.</p><button class="link-btn" style="margin-top:12px" data-a="open-ed">${I('book-marked', 'i35')}O que é o Estudo Dirigido?</button>`;
    list = `<section class="card flush"><div class="list-top"><span>Estudo dirigido</span><span><span class="mono">${r.disc.length}</span> disciplinas</span></div><div class="divide">${r.disc.map((d, i) => discRow(r, d, i)).join('')}</div></section>`;
    extra = callout('crit', `Até ${fmt(r.fim)}, não faça atividades ou provas no AVA`, 'É o fim do seu afastamento. O que for feito antes disso é anulado. Assistir às aulas e ler os materiais pode.');
  }
  return `<div class="narrow stack">
    <div><p class="page-eyebrow">Solicitação <span class="mono">#${r.id}</span> · ${TIPOS[r.tipo].short} · ${dias} ${dias === 1 ? 'dia' : 'dias'}</p><h1 class="page-title">Olá, ${st.first}</h1></div>
    <section class="card stack">${stepper(labels, now)}${main}</section>${list}${extra}
    ${callout('ok', 'Perdeu alguma prova?', 'Este sistema é só para as faltas das aulas. A prova substitutiva é pedida no Portal do Aluno, na Secretaria Virtual.', { icon: 'graduation-cap', action: A('Ver como pedir', 'open-aviso', { v: 'on-inset', size: 'xs' }) })}
    ${ebookCard()}</div>`;
}
function entregaModal(sid, i) {
  const r = reqOf(sid), d = r.disc[i], second = d.st === 'refazer';
  return `<div class="scrim" data-scrim><div class="modal md" role="dialog" aria-modal="true" aria-labelledby="em-t">
    <header class="modal-head"><div class="row-flex" style="gap:12px;flex-wrap:nowrap;align-items:flex-start"><span class="modal-ico">${I('file-text')}</span><div><h2 class="modal-title" id="em-t">${d.nome}</h2><p class="modal-sub">${second ? 'Segunda chance' : 'Atividade de compensação'} · entrega até ${fmt(second ? d.prazo2 : d.prazo)} às 23h59</p></div></div><button class="close" data-a="close-modal" aria-label="Fechar">${I('x')}</button></header>
    <div class="modal-body stack" style="padding:20px">
      <div><p class="section-label">O que fazer</p><div class="quote" style="margin-top:10px;color:var(--ink)">${esc(d.enunciado)}</div>${d.anexo ? `<div class="file" style="background:var(--surface-2);margin-top:8px">${I('paperclip', 'i35')}<span class="file-name">${esc(d.anexo)}</span><span class="tiny">material do professor</span></div>` : ''}</div>
      ${second ? `<div><p class="section-label">O que ajustar</p><div class="quote" style="margin-top:10px">${esc(d.devolutiva)}</div></div>` : ''}
      <div><p class="section-label">Sua entrega</p><input type="file" id="f-act" hidden data-in="actfile"><div id="act-file" style="margin-top:10px">${S.actFile ? `<div class="file" style="background:var(--surface-2)">${I('file-text', 'i35')}<span class="file-name">${esc(S.actFile)}</span><button class="btn ghost xs square" data-a="pick" data-target="f-act" aria-label="Trocar arquivo">${I('rotate-ccw', 'i35')}</button></div>` : `<button class="drop" style="width:100%;text-align:left" data-a="pick" data-target="f-act"><span class="drop-ico">${I('upload')}</span><span style="flex:1"><span class="strong" style="display:block;font-size:13px">Toque para anexar sua atividade</span><span class="tiny">PDF, Word ou imagem.</span></span></button>`}</div></div>
    </div>
    <footer class="modal-foot">${A('Cancelar', 'close-modal', { v: 'ghost' })}${A(second ? 'Reenviar atividade' : 'Enviar atividade', 'act-send', { v: 'primary', icon: 'send', disabled: !S.actFile, data: { d: i } })}</footer></div></div>`;
}

/* ---------- Coordenação ---------- */
function coordView() {
  const pend = S.reqs.filter(r => r.status === 'analise').sort((a, b) => a.sent < b.sent ? -1 : 1);
  const done = S.reqs.filter(r => r.status !== 'analise' && r.decided).reverse();
  const list = S.coordTab === 'pend' ? pend : done;
  if (S.coordTab === 'pend' && (!S.coordSel || !pend.find(r => r.id === S.coordSel))) S.coordSel = pend[0] ? pend[0].id : null;
  const sel = S.reqs.find(r => r.id === S.coordSel);
  const item = (r, ix) => { const dd = daysBetween(r.ini, r.fim); return `<button class="row coord-item ${r.id === S.coordSel ? 'active' : ''}" style="--i:${ix}" data-a="coord-sel" data-id="${r.id}"><div class="between" style="gap:10px"><p class="row-title">${STUD[r.sid].nome}</p><span class="mono tiny">${short(r.sent)}</span></div><p class="row-sub">${tag(TIPOS[r.tipo].short)}<span><span class="mono">${dd}</span> ${dd === 1 ? 'dia' : 'dias'}</span></p><p class="tiny" style="margin-top:4px">${MOD[modOf(dd)].what}</p>${S.coordTab === 'done' ? `<div style="margin-top:6px">${r.status === 'ajuste' ? status('Ajuste pedido', 'warn') : status('Aprovada', 'healthy')}</div>` : ''}</button>`; };
  let detail = '';
  if (S.coordTab === 'pend' && sel) {
    const dd = daysBetween(sel.ini, sel.fim), mod = modOf(dd), st = STUD[sel.sid];
    const after = { auto: 'as faltas do período são removidas automaticamente no Lyceum, em todas as disciplinas, e o aluno é avisado.', ativ: `as atividades são criadas para os professores de ${st.disc.length} ${st.disc.length === 1 ? 'disciplina' : 'disciplinas'} e o aluno é avisado.`, ed: `as ${st.disc.length} disciplinas entram no estudo dirigido, sem custo, e o aluno é avisado.` }[mod];
    detail = `<section class="card stack">
      <div class="row-flex" style="gap:14px;flex-wrap:nowrap"><span class="avatar lg">${st.ini}</span><div style="min-width:0"><h2 class="big-title" style="font-size:20px">${st.nome}</h2><p class="small">RA <span class="mono">${st.ra}</span> · ${st.curso} · ${st.serie}</p></div></div>
      ${dl([['Documento', TIPOS[sel.tipo].short], ['Período', periodo(sel)], ['Dias', `<span class="mono">${dd}</span>`], ['Caminho', MOD[mod].what]], 4)}
      <div><p class="section-label">Documento enviado</p><div class="stack-sm" style="margin-top:10px">${sel.files.map(f => `<div class="file" style="background:var(--surface-2)">${I('file-text', 'i35')}<span class="file-name">${esc(f)}</span>${A('Abrir', 'doc-open', { v: 'on-inset', size: 'xs', icon: 'external-link', data: { f: esc(f) } })}</div>`).join('')}</div>
        <p class="help">Confira: nome do aluno, datas e assinatura ou carimbo.</p></div>
      ${sel.msg ? `<div><p class="section-label">Recado do aluno</p><div class="quote" style="margin-top:10px">${esc(sel.msg)}</div></div>` : ''}
      ${S.coordAdj === sel.id ? `<div class="stack-sm"><p class="section-label">Motivo do ajuste</p><div class="choices">${MOTIVOS.map(m => `<button class="choice ${S.coordMotivo === m ? 'on' : ''}" data-a="motivo" data-m="${m}">${m}</button>`).join('')}</div><textarea class="control" rows="2" style="min-height:60px" id="adj-obs" placeholder="Observação para o aluno (opcional)">${esc(S.coordObs || '')}</textarea>
        <div class="row-flex" style="justify-content:flex-end">${A('Voltar', 'adj-cancel', { v: 'ghost' })}${A('Enviar ao aluno', 'adj-send', { v: 'primary', icon: 'send', disabled: !S.coordMotivo, data: { id: sel.id } })}</div></div>`
      : `<div class="fact row-flex" style="gap:10px;flex-wrap:nowrap;align-items:flex-start">${I('zap', 'i35')}<p class="small" style="color:var(--ink-2)">Ao aprovar, ${after}</p></div>
        <div class="row-flex m-stack" style="justify-content:flex-end">${A('Pedir ajuste', 'adj', { v: 'secondary', data: { id: sel.id } })}${A('Aprovar', 'approve', { v: 'primary', size: 'md', icon: 'check', data: { id: sel.id } })}</div>`}
    </section>`;
  } else if (S.coordTab === 'pend') detail = `<section class="card">${empty('circle-check', 'Tudo em dia', 'Nenhum documento para analisar. Quando um aluno enviar, ele aparece aqui.')}</section>`;
  else detail = `<section class="card">${empty('inbox', 'Histórico', 'As solicitações analisadas ficam aqui. Toque em Para analisar para voltar à fila.')}</section>`;
  return shell({ persona: 'coord', title: 'Documentos', content: `<div class="stack">
    <div class="page-head"><div><h1 class="page-title">Documentos para analisar</h1><p class="page-desc">Confira o documento e aprove. O sistema faz o resto: lança no Lyceum, cria as atividades ou o estudo dirigido e avisa o aluno.</p></div></div>
    <div>${`<div class="seg-track" role="tablist" data-seg="coord"><span class="seg-pill" data-keep></span>${[['pend', 'Para analisar', pend.length], ['done', 'Analisados', done.length]].map(([k, l, n]) => `<button role="tab" class="seg-btn ${S.coordTab === k ? 'active' : ''}" data-a="coord-tab" data-t="${k}">${l}<span class="seg-count">${n}</span></button>`).join('')}</div>`}</div>
    <div class="coord-grid"><section class="card flush"><div class="divide">${list.length ? list.map((r, ix) => item(r, ix)).join('') : `<div class="small" style="padding:24px 20px">${S.coordTab === 'pend' ? 'Nenhum documento na fila.' : 'Nenhuma solicitação analisada ainda.'}</div>`}</div></section><div>${detail}</div></div></div>` });
}

/* ---------- Professor ---------- */
function profItems(p) {
  const pub = [], ev = [], wait = [], hist = [];
  S.reqs.forEach(r => (r.disc || []).forEach((d, i) => {
    if (d.prof !== p || d.st === 'ed') return;
    const it = { r, d, i };
    if (d.st === 'aguardando') pub.push(it); else if (d.st === 'entregue') ev.push(it); else if (d.st === 'publicada' || d.st === 'refazer') wait.push(it); else hist.push(it);
  }));
  return { pub, eval: ev, wait, hist };
}
function profView() {
  const { pub, eval: ev, wait, hist } = profItems(S.prof);
  const row = ({ r, d, i }, kind, j = 0) => { const st = STUD[r.sid];
    const info = kind === 'pub' ? `Afastamento ${periodo(r)} · entrega até <span class="mono">${fmt(d.prazo || addDays(r.fim, 15))}</span>` : kind === 'eval' ? `Entregue em <span class="mono">${fmt(d.entAt)}</span> · ${d.tent === 2 ? 'segunda chance' : 'primeira entrega'}` : kind === 'wait' ? `Publicada · o aluno entrega até <span class="mono">${fmt(d.st === 'refazer' ? d.prazo2 : d.prazo)}</span>` : (d.st === 'aceita' ? 'Aceita' : 'Não aceita') + ` em <span class="mono">${fmt(d.evalAt)}</span>`;
    const act = kind === 'pub' ? A('Publicar atividade', 'pub-open', { v: 'secondary', size: 'sm', data: { r: r.id, d: i } }) : kind === 'eval' ? A('Avaliar', 'eval-open', { v: 'secondary', size: 'sm', data: { r: r.id, d: i } }) : '';
    return `<div class="drow" style="--i:${j}"><div class="drow-main"><p class="row-title">${st.nome}</p><p class="row-sub"><span>${d.nome}</span><span>·</span><span class="mono">${d.cod}</span></p><p class="small" style="margin-top:6px">${info}</p></div>${act ? `<div class="drow-act">${act}</div>` : ''}</div>`; };
  const sec = (title, sub, items, kind, emptyMsg) => `<section class="card flush"><div class="list-top"><span style="color:var(--ink);font-weight:600;font-size:12px">${title}</span><span><span class="mono">${items.length}</span> ${sub}</span></div>${items.length ? `<div class="divide">${items.map((x, j) => row(x, kind, j)).join('')}</div>` : `<p class="small" style="padding:18px 20px">${emptyMsg}</p>`}</section>`;
  return shell({ persona: 'prof', title: 'Atividades', content: `<div class="narrow stack" style="max-width:820px">
    <div class="between m-stack" style="align-items:flex-end;gap:12px"><div><h1 class="page-title">Atividades de compensação</h1><p class="page-desc">Publique uma atividade e avalie a entrega. Prazo, lembretes e avisos ao aluno são automáticos.</p></div></div>
    <div class="stack-sm"><p class="tiny">Ver como:</p><div class="seg-track" role="tablist" data-seg="prof" style="max-width:100%;overflow-x:auto"><span class="seg-pill" data-keep></span>${Object.entries(PROFS).map(([k, n]) => `<button role="tab" class="seg-btn ${S.prof === k ? 'active' : ''}" data-a="prof-sel" data-p="${k}">${n}</button>`).join('')}</div></div>
    ${!pub.length && !ev.length && !wait.length && !hist.length ? `<section class="card">${empty('clipboard-list', 'Nenhuma atividade por enquanto', 'Quando a coordenação aprovar um afastamento de 15 a 39 dias de um aluno seu, a atividade para publicar aparece aqui e você recebe um e-mail.')}</section>` : `
    ${sec('Para publicar', 'pendentes', pub, 'pub', 'Nenhuma atividade para publicar.')}
    ${sec('Para avaliar', 'entregas', ev, 'eval', 'Nenhuma entrega para avaliar.')}
    ${wait.length ? sec('Aguardando o aluno', 'publicadas', wait, 'wait', '') : ''}
    ${hist.length ? sec('Concluídas', 'avaliadas', hist, 'hist', '') : ''}`}</div>` });
}

      <div><input type="file" id="f-pub" hidden data-in="pubfile"><div id="pub-file">${S.pubFile ? `<div class="file" style="background:var(--surface-2)">${I('paperclip', 'i35')}<span class="file-name">${esc(S.pubFile)}</span></div>` : `<button class="link-btn" data-a="pick" data-target="f-pub">${I('paperclip', 'i35')}Anexar material (opcional)</button>`}</div></div>

function evalModal(rid, i) {
  const r = S.reqs.find(x => x.id === +rid), d = r.disc[i], st = STUD[r.sid], second = d.tent === 2;

    <header class="modal-head"><div><h2 class="modal-title" id="vm-t">Avaliar entrega</h2><p class="modal-sub">${d.nome} · ${st.nome} · ${second ? 'segunda chance' : 'primeira entrega'}</p></div><button class="close" data-a="close-modal" aria-label="Fechar">${I('x')}</button></header>

      <p class="tiny">${second ? 'Esta é a segunda chance. Se não aceitar, as faltas desta disciplina continuam registradas.' : 'Se pedir ajuste, o aluno ganha uma segunda chance, com novo prazo de 7 dias, automaticamente.'}</p>

function docModal(f) {
  return `<div class="scrim" data-scrim><div class="modal md" role="dialog" aria-modal="true" aria-label="Documento"><header class="modal-head"><div><h2 class="modal-title">${esc(f)}</h2><p class="modal-sub">Pré-visualização de demonstração</p></div><button class="close" data-a="close-modal" aria-label="Fechar">${I('x')}</button></header>
